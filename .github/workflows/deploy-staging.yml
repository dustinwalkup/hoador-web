# .github/workflows/deploy-staging.yml
name: Deploy to Staging

# Only run on pushes to develop branch after CI passes.
# Note: workflow_run triggers use the workflow file from the default branch (main).
# Merge this workflow into main once so "Deploy to Staging" runs when CI completes on develop.
on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches: [develop]
  workflow_dispatch: # Allow manual triggering

# Prevent concurrent deployments
concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check if CI passed before deploying
  check-ci:
    name: Check CI Status
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      - name: Check CI conclusion
        id: check
        run: |
          echo "CI workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Event name: ${{ github.event_name }}"
          # Only deploy on direct pushes to develop, not PR runs
          if [[ "${{ github.event.workflow_run.event }}" == "pull_request" ]]; then
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping deploy - triggered by a PR, not a direct push"
            exit 0
          fi

          if [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]] || \
            [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  # Deploy to Vercel Staging
  deploy-vercel:
    name: Deploy to Vercel Staging
    runs-on: ubuntu-latest
    needs: check-ci
    if: needs.check-ci.outputs.should-deploy == 'true'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Deploy the branch that passed CI (develop), not the default branch (main)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} \
            -m githubCommitSha=${{ github.event.workflow_run.head_sha || github.sha }} \
            -m githubCommitRef=${{ github.event.workflow_run.head_branch || 'develop' }} \
            -m githubCommitAuthorLogin=${{ github.actor }} \
            -m githubOrg=${{ github.repository_owner }} \
            -m githubRepo=hoador-web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Notify deployment status
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [check-ci, deploy-vercel]
    if: always() && needs.check-ci.outputs.should-deploy == 'true'
    steps:
      - name: Notify success
        if: needs.deploy-vercel.result == 'success'
        run: |
          echo "✅ Staging deployment successful!"

      - name: Notify failure
        if: needs.deploy-vercel.result == 'failure'
        run: |
          echo "❌ Staging deployment failed!"
