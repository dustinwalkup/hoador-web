# .github/workflows/deploy-staging.yml
name: Deploy to Staging

# Only run on pushes to develop branch after CI and E2E both pass.
# Note: workflow_run triggers use the workflow file from the default branch (main).
# Merge this workflow into main once so "Deploy to Staging" runs when CI completes on develop.
on:
  workflow_run:
    workflows: ["CI/CD Pipeline", "E2E Tests"]
    types:
      - completed
    branches: [develop]
  workflow_dispatch: # Allow manual triggering

# Prevent concurrent deployments. Queue rather than cancel: this fires twice
# per commit (once per upstream workflow), and cancelling would let one
# commit's no-op run kill another commit's in-flight deploy. A newer pending
# run still replaces an older pending one.
concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Deploy only a commit on which BOTH CI and E2E passed. Either workflow
  # finishing fires this; the first to finish no-ops here and the second
  # deploys, so both are looked up by SHA rather than trusting the trigger.
  check-ci:
    name: Check CI Status
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
      head-sha: ${{ steps.check.outputs.head-sha }}
    steps:
      - name: Resolve commit and confirm CI + E2E passed on it
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const isDispatch = context.eventName === "workflow_dispatch";
            const headSha = isDispatch ? context.sha : context.payload.workflow_run.head_sha;
            core.setOutput("head-sha", headSha);
            if (isDispatch) {
              // Manual override: skips both checks.
              core.setOutput("should-deploy", "true");
              return;
            }
            // Only direct pushes deploy, never a PR's run.
            if (context.payload.workflow_run.event === "pull_request") {
              core.info("Triggered by a PR run, not a direct push: skipping.");
              core.setOutput("should-deploy", "false");
              return;
            }
            const trigger = context.payload.workflow_run;
            if (trigger.conclusion !== "success") {
              core.setOutput("should-deploy", "false");
              core.setFailed(`"${trigger.name}" concluded ${trigger.conclusion} for ${headSha}: not deploying.`);
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: headSha,
              event: "push",
              per_page: 100,
            });
            for (const workflowName of ["CI/CD Pipeline", "E2E Tests"]) {
              // Newest first, so a re-run's latest attempt wins.
              const run = data.workflow_runs.find((r) => r.name === workflowName);
              if (!run || run.status !== "completed" || run.conclusion !== "success") {
                core.info(`"${workflowName}" for ${headSha}: ${run ? `${run.status}/${run.conclusion}` : "no run"}. Not deploying on this trigger.`);
                core.setOutput("should-deploy", "false");
                return;
              }
            }
            core.setOutput("should-deploy", "true");

  # Deploy to Vercel Staging
  deploy-vercel:
    name: Deploy to Vercel Staging
    runs-on: ubuntu-latest
    needs: check-ci
    if: needs.check-ci.outputs.should-deploy == 'true'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # The commit CI and E2E passed on, not the default branch (main)
          ref: ${{ needs.check-ci.outputs.head-sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: |
          for i in 1 2 3; do
            npm install -g vercel@latest && exit 0
            echo "npm install -g vercel failed (attempt $i/3), retrying in 15s..."
            sleep 15
          done
          echo "npm install -g vercel failed after 3 attempts" >&2
          exit 1

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} \
            -m githubCommitSha=${{ needs.check-ci.outputs.head-sha }} \
            -m githubCommitRef=${{ github.event.workflow_run.head_branch || 'develop' }} \
            -m githubCommitAuthorLogin=${{ github.actor }} \
            -m githubOrg=${{ github.repository_owner }} \
            -m githubRepo=hoador-web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Notify deployment status
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [check-ci, deploy-vercel]
    if: always() && needs.check-ci.outputs.should-deploy == 'true'
    steps:
      - name: Notify success
        if: needs.deploy-vercel.result == 'success'
        run: |
          echo "✅ Staging deployment successful!"

      - name: Notify failure
        if: needs.deploy-vercel.result == 'failure'
        run: |
          echo "❌ Staging deployment failed!"
