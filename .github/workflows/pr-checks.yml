# .github/workflows/pr-checks.yml
name: Pull Request Checks

# Run on pull requests to main and develop branches
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

jobs:
  # Check if PR is ready for review
  pr-ready:
    name: PR Ready Check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check PR size
        uses: actions/github-script@v8
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // Generated/lockfile/doc paths that shouldn't count toward PR size.
            // Drizzle writes a full schema snapshot per migration; lockfiles
            // churn on dependency bumps; markdown docs don't carry the same
            // review burden as code. None reflect reviewer load on logic.
            const EXCLUDED = [
              /^src\/db\/migrations\/meta\//,
              /(^|\/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?)$/,
              /\.md$/i,
            ];
            const isExcluded = (f) => EXCLUDED.some((re) => re.test(f.filename));

            const countedFiles = files.filter((f) => !isExcluded(f));
            const excludedFiles = files.filter(isExcluded);
            const changedLines = countedFiles.reduce((acc, file) => acc + file.changes, 0);
            const excludedLines = excludedFiles.reduce((acc, file) => acc + file.changes, 0);

            if (excludedLines > 0) {
              console.log(`Excluded ${excludedLines} lines across ${excludedFiles.length} generated/lockfile(s):`);
              excludedFiles.forEach((f) => console.log(`  - ${f.filename} (${f.changes} lines)`));
            }

            if (changedLines > 1000) {
              core.setFailed(`PR is too large: ${changedLines} lines changed (excluding generated files). Consider breaking into smaller PRs.`);
            } else {
              console.log(`PR size is acceptable: ${changedLines} lines changed (excluding generated files)`);
            }

  # Run tests with coverage
  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  # Check for breaking changes
  breaking-changes:
    name: Breaking Changes Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for breaking changes
        run: |
          # Check if any files in src/ have breaking changes
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^src/.*\.(ts|tsx)$'; then
            echo "⚠️  Breaking changes detected in source files"
            echo "Please ensure all breaking changes are documented in the PR description"
          fi

  # Performance check
  performance:
    name: Performance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build and measure
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          OPENCAGE_API_KEY: ${{ secrets.OPENCAGE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: preview
        run: |
          echo "Building application..."
          time bun run build
          echo "Build completed successfully"

      - name: Check bundle size
        run: |
          if [ -d ".next" ]; then
            echo "Checking bundle size..."
            du -sh .next/static/chunks/*.js | sort -hr | head -10
          fi
