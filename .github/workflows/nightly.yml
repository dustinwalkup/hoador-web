# .github/workflows/nightly.yml
name: Nightly Maintenance

# Run every night at 2 AM UTC
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  # Update dependencies
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Check for outdated packages
        run: bun outdated

      - name: Update dependencies (dry run)
        run: |
          echo "Checking what would be updated..."
          bun update --dry-run

  # Run comprehensive tests
  comprehensive-tests:
    name: Comprehensive Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run all tests
        run: bun run test:run

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Type check
        run: bun run type-check

      - name: Lint check
        run: bun run lint

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    outputs:
      has_vulnerabilities: ${{ steps.parse.outputs.has_vulnerabilities }}
      critical: ${{ steps.parse.outputs.critical }}
      high: ${{ steps.parse.outputs.high }}
      moderate: ${{ steps.parse.outputs.moderate }}
      low: ${{ steps.parse.outputs.low }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run security audit
        id: audit
        continue-on-error: true
        run: |
          echo "Running security audit..."
          bun audit > audit-report.txt 2>&1 || true
          cat audit-report.txt

      - name: Parse audit results
        id: parse
        run: |
          if grep -qi "vulnerabilities" audit-report.txt 2>/dev/null; then
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
            
            # Count vulnerabilities by severity (case-insensitive, strip whitespace/newlines)
            CRITICAL=$(grep -ic "critical" audit-report.txt 2>/dev/null | tr -d '\n\r ' || echo "0")
            HIGH=$(grep -ic "high" audit-report.txt 2>/dev/null | tr -d '\n\r ' || echo "0")
            MODERATE=$(grep -ic "moderate" audit-report.txt 2>/dev/null | tr -d '\n\r ' || echo "0")
            LOW=$(grep -ic "low" audit-report.txt 2>/dev/null | tr -d '\n\r ' || echo "0")
            
            # Ensure values are numeric and not empty (default to 0 if empty)
            CRITICAL=${CRITICAL:-0}
            HIGH=${HIGH:-0}
            MODERATE=${MODERATE:-0}
            LOW=${LOW:-0}
            
            # Strip any remaining whitespace and ensure numeric
            CRITICAL=$(echo "${CRITICAL}" | tr -d '[:space:]' || echo "0")
            HIGH=$(echo "${HIGH}" | tr -d '[:space:]' || echo "0")
            MODERATE=$(echo "${MODERATE}" | tr -d '[:space:]' || echo "0")
            LOW=$(echo "${LOW}" | tr -d '[:space:]' || echo "0")
            
            # Write outputs with proper formatting (one per line, no trailing spaces)
            echo "critical=${CRITICAL}" >> $GITHUB_OUTPUT
            echo "high=${HIGH}" >> $GITHUB_OUTPUT
            echo "moderate=${MODERATE}" >> $GITHUB_OUTPUT
            echo "low=${LOW}" >> $GITHUB_OUTPUT
            
            echo "⚠️ Security vulnerabilities detected:"
            echo "  Critical: ${CRITICAL}"
            echo "  High: ${HIGH}"
            echo "  Moderate: ${MODERATE}"
            echo "  Low: ${LOW}"
          else
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
            echo "critical=0" >> $GITHUB_OUTPUT
            echo "high=0" >> $GITHUB_OUTPUT
            echo "moderate=0" >> $GITHUB_OUTPUT
            echo "low=0" >> $GITHUB_OUTPUT
            echo "✅ No vulnerabilities found"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-audit-report
          path: audit-report.txt
          retention-days: 30

  # Database health check (if applicable)
  database-health:
    name: Database Health Check
    runs-on: ubuntu-latest
    if: false # Set to true if you have database health checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run database health checks
        run: |
          echo "Running database health checks..."
          # Add your database health check commands here
          # bun run db:health-check

  # Performance monitoring
  performance-check:
    name: Performance Check
    runs-on: ubuntu-latest
    env:
      # Use real secrets if available, otherwise use dummy values for build testing
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_dummy_key_for_build_testing' }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_dummy_key' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'dummy_secret_for_build_testing_min_32_chars_long' }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL || 'https://example.com' }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://example.com' }}
      OPENCAGE_API_KEY: ${{ secrets.OPENCAGE_API_KEY || 'mock_opencage_key_for_build' }}
      # Mock API keys for build testing (secrets used in production deployments)
      OPENAI_API_KEY: sk-mock_openai_key_for_build
      SERP_API_KEY: mock_serp_key_for_build

      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'mock_resend_key_for_build' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build and measure performance
        run: |
          echo "Building application for performance check..."
          time bun run build

          echo "Checking bundle sizes..."
          if [ -d ".next/static/chunks" ]; then
            echo "Largest JavaScript chunks:"
            du -sh .next/static/chunks/*.js | sort -hr | head -5
          fi

  # Generate reports
  generate-reports:
    name: Generate Reports
    runs-on: ubuntu-latest
    needs: [comprehensive-tests, security-audit, performance-check]
    if: always()
    steps:
      - name: Download audit report
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: security-audit-report
          path: ./

      - name: Generate nightly report
        run: |
          echo "# Nightly Report - $(date)" > nightly-report.md
          echo "" >> nightly-report.md

          echo "## Test Results" >> nightly-report.md
          echo "- Comprehensive Tests: ${{ needs.comprehensive-tests.result }}" >> nightly-report.md
          echo "- Security Audit: ${{ needs.security-audit.result }}" >> nightly-report.md
          echo "- Performance Check: ${{ needs.performance-check.result }}" >> nightly-report.md
          echo "" >> nightly-report.md

          echo "## Security Audit Details" >> nightly-report.md
          if [ "${{ needs.security-audit.outputs.has_vulnerabilities }}" == "true" ]; then
            echo "⚠️ **Vulnerabilities Found:**" >> nightly-report.md
            echo "- Critical: ${{ needs.security-audit.outputs.critical }}" >> nightly-report.md
            echo "- High: ${{ needs.security-audit.outputs.high }}" >> nightly-report.md
            echo "- Moderate: ${{ needs.security-audit.outputs.moderate }}" >> nightly-report.md
            echo "- Low: ${{ needs.security-audit.outputs.low }}" >> nightly-report.md
            echo "" >> nightly-report.md
            echo "See the security-audit-report artifact for full details." >> nightly-report.md
          else
            echo "✅ No vulnerabilities detected" >> nightly-report.md
          fi
          echo "" >> nightly-report.md

          echo "## Summary" >> nightly-report.md
          echo "All nightly checks completed at $(date)" >> nightly-report.md

          # Append audit report if it exists
          if [ -f "audit-report.txt" ]; then
            echo "" >> nightly-report.md
            echo "## Full Audit Report" >> nightly-report.md
            echo '```' >> nightly-report.md
            cat audit-report.txt >> nightly-report.md
            echo '```' >> nightly-report.md
          fi

      - name: Upload report
        uses: actions/upload-artifact@v6
        with:
          name: nightly-report
          path: nightly-report.md
          retention-days: 30
