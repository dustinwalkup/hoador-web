# .github/workflows/nightly.yml
name: Nightly Maintenance

# Run every night at 2 AM UTC
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  # Update dependencies
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for outdated packages
        run: bun outdated

      - name: Update dependencies (dry run)
        run: |
          echo "Checking what would be updated..."
          bun update --dry-run

  # Run comprehensive tests
  comprehensive-tests:
    name: Comprehensive Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run all tests
        run: bun run test:run

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Type check
        run: bun run type-check

      - name: Lint check
        run: bun run lint

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        run: bun audit

      - name: Check for known vulnerabilities
        run: |
          echo "Checking for security vulnerabilities..."
          bun audit --audit-level moderate

  # Database health check (if applicable)
  database-health:
    name: Database Health Check
    runs-on: ubuntu-latest
    if: false # Set to true if you have database health checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database health checks
        run: |
          echo "Running database health checks..."
          # Add your database health check commands here
          # bun run db:health-check

  # Performance monitoring
  performance-check:
    name: Performance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and measure performance
        run: |
          echo "Building application for performance check..."
          time bun run build

          echo "Checking bundle sizes..."
          if [ -d ".next/static/chunks" ]; then
            echo "Largest JavaScript chunks:"
            du -sh .next/static/chunks/*.js | sort -hr | head -5
          fi

  # Generate reports
  generate-reports:
    name: Generate Reports
    runs-on: ubuntu-latest
    needs: [comprehensive-tests, security-audit, performance-check]
    if: always()
    steps:
      - name: Generate nightly report
        run: |
          echo "# Nightly Report - $(date)" > nightly-report.md
          echo "" >> nightly-report.md
          echo "## Test Results" >> nightly-report.md
          echo "- Comprehensive Tests: ${{ needs.comprehensive-tests.result }}" >> nightly-report.md
          echo "- Security Audit: ${{ needs.security-audit.result }}" >> nightly-report.md
          echo "- Performance Check: ${{ needs.performance-check.result }}" >> nightly-report.md
          echo "" >> nightly-report.md
          echo "## Summary" >> nightly-report.md
          echo "All nightly checks completed at $(date)" >> nightly-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: nightly-report.md
