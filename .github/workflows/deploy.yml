# .github/workflows/deploy.yml
name: Deploy to Production

# Only run on pushes to main branch after CI passes
on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches: [main]
  workflow_dispatch: # Allow manual triggering

# Prevent concurrent deployments
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check if CI passed before deploying
  check-ci:
    name: Check CI Status
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      - name: Check CI conclusion
        id: check
        run: |
          echo "CI workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Event name: ${{ github.event_name }}"
          if [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "✅ CI passed - proceeding with deployment"
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            echo "❌ CI failed - skipping deployment"
            exit 1
          fi

  # Deploy to Vercel (if using Vercel)
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: check-ci
    if: needs.check-ci.outputs.should-deploy == 'true'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build application
        run: bun run build
        env:
          # Add any build-time environment variables here
          NEXT_PUBLIC_APP_URL: ${{ github.server_url }}/${{ github.repository }}
          # Mock API keys for build (not used in production)
          STRIPE_SECRET_KEY: sk_test_mock_key_for_build_only
          DATABASE_URL: postgresql://mock:mock@localhost:5432/mock_db
          OPENCAGE_API_KEY: mock_opencage_key_for_build
          OPENAI_API_KEY: sk-mock_openai_key_for_build
          SERP_API_KEY: mock_serp_key_for_build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: .next/
          retention-days: 1

  # Notify deployment status
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [check-ci, deploy-vercel]
    if: always() && needs.check-ci.outputs.should-deploy == 'true'
    steps:
      - name: Notify success
        if: needs.deploy-vercel.result == 'success'
        run: |
          echo "✅ Deployment successful!"

      - name: Notify failure
        if: needs.deploy-vercel.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
