name: Vercel Preview Deployment

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

jobs:
  preview:
    name: Build & Deploy Preview
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # 1️⃣ Checkout the PR code
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2️⃣ Setup Bun (your runtime)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: bun install

      # 4️⃣ Build the application
      - name: Build application
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          OPENCAGE_API_KEY: ${{ secrets.OPENCAGE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: preview
        run: bun run build

      # 5️⃣ Deploy to Vercel (Preview)
      - name: Install Vercel CLI
        run: |
          for i in 1 2 3; do
            npm install -g vercel@latest && exit 0
            echo "npm install -g vercel failed (attempt $i/3), retrying in 15s..."
            sleep 15
          done
          echo "npm install -g vercel failed after 3 attempts" >&2
          exit 1

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Preview)
        run: |
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} \
            -m githubCommitSha=${{ github.sha }} \
            -m githubCommitRef=${{ github.head_ref }} \
            -m githubCommitAuthorLogin=${{ github.actor }} \
            -m githubOrg=${{ github.repository_owner }} \
            -m githubRepo=hoador-web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
