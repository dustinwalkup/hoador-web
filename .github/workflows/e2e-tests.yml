# .github/workflows/e2e-tests.yml
name: E2E Tests

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bunx playwright test
        env:
          E2E_TEST: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          NEXT_PUBLIC_APP_URL: http://localhost:3001
          BETTER_AUTH_SECRET: ${{ secrets.E2E_BETTER_AUTH_SECRET || 'e2e-fallback-auth-secret-32chars!' }}
          RESEND_API_KEY: ${{ secrets.E2E_RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.E2E_GOOGLE_CLIENT_ID || 'e2e-placeholder-client-id' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.E2E_GOOGLE_CLIENT_SECRET || 'e2e-placeholder-secret' }}
          GOOGLE_CALLBACK_URL: http://localhost:3001/api/auth/callback/google
          CRON_SECRET: ${{ secrets.E2E_CRON_SECRET || 'e2e-test-cron-secret' }}
          # Add any other env vars your app needs to start
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          OPENCAGE_API_KEY: ${{ secrets.OPENCAGE_API_KEY }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
