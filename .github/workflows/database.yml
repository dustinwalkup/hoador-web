# .github/workflows/database.yml
name: Database Operations

# Only run on manual trigger (disabled automatic triggers)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Database operation to perform"
        required: true
        default: "migrate"
        type: choice
        options:
          - migrate
          - generate
          - seed
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  # Generate database migrations
  generate-migrations:
    name: Generate Migrations
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'generate'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Generate migrations
        run: bun run db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Run database migrations
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'migrate'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Seed database. `bun run seed` truncates every table, so never production.
  # There is no `push` operation: push never creates rental_requests_no_overlap
  # and silently drifts from the migration history (R-DB-02).
  seed:
    name: Seed Database
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'seed' && github.event.inputs.environment != 'production'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Seed database
        run: bun run seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  reject-prod-seed:
    name: Block destructive seed on production
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'seed' && github.event.inputs.environment == 'production'
    steps:
      - run: |
          echo "::error::'seed' truncates every table. Never on production; run the seed:* reference-data scripts in src/db/migrations/README.md by hand."
          exit 1
