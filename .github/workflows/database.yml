# .github/workflows/database.yml
name: Database Operations

# Only run on manual trigger (disabled automatic triggers)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Database operation to perform"
        required: true
        default: "migrate"
        type: choice
        options:
          - migrate
          - generate
          - push
          - seed
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  # Generate database migrations
  generate-migrations:
    name: Generate Migrations
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'generate'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Generate migrations
        run: bun run db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Run database migrations
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'migrate'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Push schema changes (for development)
  push-schema:
    name: Push Schema
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'push'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Push schema changes
        run: bun run db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Seed database
  seed:
    name: Seed Database
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'seed'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Seed database
        run: bun run seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
